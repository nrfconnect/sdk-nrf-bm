# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_BM_UARTE=y

# SoftDevice: the handler library forwards the stack's interrupts, runs its reset
# handler and hands SoC events to observers from the event interrupt. The sample
# enables the stack and polls BLE events itself.
CONFIG_SOFTDEVICE=y
CONFIG_NRF_SDH=y
CONFIG_NRF_SDH_DISPATCH_MODEL_IRQ=y
CONFIG_NRF_SDH_BLE=n
CONFIG_NRF_SDH_SOC_RAND_SEED=n

# Random seed for the stack
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

CONFIG_REBOOT=y

# Link into the 128 kB code partition, below the update slot
CONFIG_USE_DT_CODE_PARTITION=y
